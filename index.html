["表示",p=>{p.append(group("表示倍率",["fit","actual"]));p.append(customGroup("ページ表示",r=>{const b=document.createElement("button");b.className="rb on";b.textContent="ページ番号";b.onclick=()=>{$("#page-stage").classList.toggle("hide-page-numbers");b.classList.toggle("on")};r.append(b)}))}]];
defs.forEach(([n,build],i)=>{const t=document.createElement("button");t.className="tab";t.textContent=n;t.onclick=()=>selectTab(i);$("#tabs").append(t);const p=document.createElement("div");p.className="rpage";build(p);$("#rpages").append(p)});selectTab(0)}function selectTab(i){$$('.tab').forEach((x,j)=>x.classList.toggle('active',i===j));$$('.rpage').forEach((x,j)=>x.classList.toggle('show',i===j))}
function showMenu(items){const m=$("#menu");m.innerHTML="";items.forEach(x=>{if(x==="sep"){m.append(Object.assign(document.createElement("div"),{className:"menu-sep"}));return}const d=document.createElement("div");d.className="menu-item";d.textContent=x[0];d.onclick=()=>{m.classList.add("hidden");x[1]()};m.append(d)});const r=$("#fileBtn").getBoundingClientRect();m.style.left=r.left+"px";m.style.top=r.bottom+"px";m.classList.remove("hidden")}
function modal(title,fields,message=""){return new Promise(resolve=>{const body=$("#mbody"),foot=$("#mfoot");$("#mtitle").textContent=title;body.innerHTML=message?`<div>${esc(message)}</div>`:"";foot.innerHTML="";const map={};fields.forEach(f=>{const w=document.createElement("div");w.className="field";w.innerHTML=f.label?`<label>${esc(f.label)}</label>`:"";const x=document.createElement(f.type==="textarea"?"textarea":f.type==="select"?"select":"input");if(x.tagName==="INPUT")x.type=f.type||"text";if(f.options)f.options.forEach(o=>x.add(new Option(o.label,o.value)));x.value=f.value||"";map[f.id]=x;w.append(x);body.append(w)});const done=v=>{$("#modalBg").classList.add("hidden");const out={};Object.keys(map).forEach(k=>out[k]=map[k].value);resolve(v?out:null)};[["OK",1,"primary"],["キャンセル",0,""]].forEach(a=>{const b=document.createElement("button");b.className="btn "+a[2];b.textContent=a[0];b.onclick=()=>done(a[1]);foot.append(b)});$("#mclose").onclick=()=>done(0);$("#modalBg").classList.remove("hidden");setTimeout(()=>Object.values(map)[0]?.focus(),10)})}
async function askTable(){const r=await modal("表を挿入",[{id:"rows",label:"行数",type:"number",value:"3"},{id:"cols",label:"列数",type:"number",value:"3"}]);if(!r)return;let h="<table><tbody>";for(let y=0;y<Math.min(30,+r.rows||3);y++){h+="<tr>";for(let x=0;x<Math.min(12,+r.cols||3);x++)h+="<td><br></td>";h+="</tr>"}insertHtml(h+"</tbody></table><p><br></p>","表を挿入しました")}
function data(){return{format:FORMAT,version:2,application:APP,license:LICENSE,paper:{width:getComputedStyle(document.documentElement).getPropertyValue("--page-w").trim(),height:getComputedStyle(document.documentElement).getPropertyValue("--page-h").trim()},savedAt:new Date().toISOString(),pages:pages().map(p=>({html:ed(p).innerHTML}))}}function download(name,text){const a=document.createElement("a"),u=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function saveDoc(){let n=currentName||$("#docTitle").value||"無題";if(!n.endsWith(EXT))n+=EXT;download(n,JSON.stringify(data(),null,2));currentName=n.slice(0,-EXT.length);modified=false;document.title=`${currentName}${EXT} - ${APP}`;status("保存しました: "+n);saveDraft()}async function openDoc(f){try{const d=JSON.parse(await f.text());if(d.format!==FORMAT)throw Error("対応していない形式です");$("#pages").innerHTML="";(d.pages||[]).forEach(x=>page(x.html||""));if(!pages().length)page("");if(d.paper){document.documentElement.style.setProperty("--page-w",d.paper.width||"210mm");document.documentElement.style.setProperty("--page-h",d.paper.height||"297mm")}currentName=f.name.replace(/\.tivensy$/i,"");$("#docTitle").value=currentName;modified=false;stats();status("開きました: "+f.name);saveDraft()}catch(e){alert("読込エラー: "+e.message)}}function saveDraft(){try{localStorage.setItem("tivenShoinStandard.v1",JSON.stringify({name:currentName,data:data()}))}catch{}}function restoreDraft(){try{const o=JSON.parse(localStorage.getItem("tivenShoinStandard.v1"));if(!o?.data?.pages)return false;o.data.pages.forEach(x=>page(x.html));currentName=o.name;if(currentName)$("#docTitle").value=currentName;return true}catch{return false}}
function setZoom(n){zoom=Math.max(50,Math.min(160,+n));$("#page-stage").style.zoom=zoom/100;$("#zoom").value=zoom;$("#zlabel").textContent=zoom+"%"}function fit(){const mm=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--page-w"))||210;setZoom(Math.floor(($("#workspace").clientWidth-116)/(mm*96/25.4)*100));status("ページ幅に合わせました")}function doPrint(){window.print()}
function init(){["save","undo","redo","print"].forEach(id=>{const b=document.createElement("button");b.innerHTML=ico(actions[id][1]);b.title=actions[id][0];b.onclick=actions[id][2];$("#qat").append(b)});buildRibbon();if(!restoreDraft())page("<h1>文書タイトル</h1><p>ここに文章を入力してください。</p>");stats();setZoom(100);$("#fileBtn").onclick=e=>{e.stopPropagation();showMenu([["新規作成",()=>{if(!modified||confirm("変更を破棄しますか？")){$("#pages").innerHTML="";page("");currentName=null;$("#docTitle").value="無題";modified=false}}],["開く",()=>$("#fileInput").click()],["保存",saveDoc],"sep",["印刷 / PDF",doPrint],["文書情報",()=>alert(`${APP}\nVersion 1.0\n\n${LICENSE}`)]])};$("#helpBtn").onclick=()=>alert("Ctrl+S 保存 / Ctrl+O 開く / Ctrl+P 印刷\nCtrl+Z 元に戻す / Ctrl+Y やり直す\nCtrl+B 太字 / Ctrl+I 斜体 / Ctrl+U 下線\n\n文章は自動的に次ページへ送られます。");$("#fileInput").onchange=e=>e.target.files[0]&&openDoc(e.target.files[0]);$("#imageInput").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>insertHtml(`<img src="${r.result}" alt="挿入画像"><p><br></p>`,"画像を挿入しました");r.readAsDataURL(f);e.target.value=""};$("#docTitle").onchange=e=>{currentName=e.target.value.trim()||"無題";mark("文書名を変更しました")};$("#zoom").oninput=e=>setZoom(e.target.value);$("#zin").onclick=()=>setZoom(zoom+10);$("#zout").onclick=()=>setZoom(zoom-10);document.onclick=()=>$("#menu").classList.add("hidden");document.onkeydown=e=>{if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();if(k==="s"){e.preventDefault();saveDoc()}else if(k==="o"){e.preventDefault();$("#fileInput").click()}else if(k==="p"){e.preventDefault();doPrint()}else if(k==="z"){e.preventDefault();doUndo()}else if(k==="y"){e.preventDefault();doRedo()}else if(k==="b"){e.preventDefault();cmd("bold")}else if(k==="i"){e.preventDefault();cmd("italic")}else if(k==="u"){e.preventDefault();cmd("underline")}};setTimeout(()=>{$("#splash").classList.add("out");setTimeout(()=>$("#splash")?.remove(),550);activeEd().focus();status("準備完了。Ctrl+Sで保存、Ctrl+Pで印刷・PDF出力。")},1000)}init();
</script>
