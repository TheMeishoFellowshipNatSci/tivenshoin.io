<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- user-scalable=no でスマホでの自動縮小を防止 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>迪温書院</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            /* iOS Safari などのアドレスバー対策 */
            position: fixed;
            top: 0;
            left: 0;
        }
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 最新のビューポート単位（モバイル対応） */
            height: 100dvh;
            min-height: -webkit-fill-available;
            border: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <!-- sandbox属性でGAS側のスクリプトがブロックされないように権限を付与 -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbzZOA_x38x3vM_XZJMoU2iEiRo7-B6xoVbMBSa7VCLxJreJkTjNHYgBIaSqScYgVODckA/exec" 
        allowfullscreen
        scrolling="no"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation allow-modals allow-downloads"
    ></iframe>
</body>
</html>
